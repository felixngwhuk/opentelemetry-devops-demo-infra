---
- name: Set Terraform variables
  ansible.builtin.set_fact:
    terraform_work_dir: "/tmp/terraform-{{ terraform_version }}"
    terraform_zip_path: "/tmp/terraform_{{ terraform_version }}_linux_{{ terraform_arch }}.zip"
    terraform_checksum_path: "/tmp/terraform_{{ terraform_version }}_SHA256SUMS"
    terraform_bin_path: /usr/local/bin/terraform

- name: Ensure Terraform work directory exists
  ansible.builtin.file:
    path: "{{ terraform_work_dir }}"
    state: directory
    mode: "0755"

- name: Skip Terraform installer during check mode
  ansible.builtin.debug:
    msg: "Skipping Terraform checksum download, archive download, extract, and install during check mode."
  when: ansible_check_mode

- name: Download Terraform checksum file
  ansible.builtin.get_url:
    url: "https://releases.hashicorp.com/terraform/{{ terraform_version }}/terraform_{{ terraform_version }}_SHA256SUMS"
    dest: "{{ terraform_checksum_path }}"
    mode: "0644"
  when: not ansible_check_mode

- name: Extract expected Terraform checksum
  ansible.builtin.shell: |
    set -o pipefail
    grep "terraform_{{ terraform_version }}_linux_{{ terraform_arch }}.zip" "{{ terraform_checksum_path }}" | awk '{print $1}'
  args:
    executable: /bin/bash
  register: terraform_expected_checksum
  changed_when: false
  when: not ansible_check_mode

- name: Download pinned Terraform archive
  ansible.builtin.get_url:
    url: "https://releases.hashicorp.com/terraform/{{ terraform_version }}/terraform_{{ terraform_version }}_linux_{{ terraform_arch }}.zip"
    dest: "{{ terraform_zip_path }}"
    mode: "0644"
    checksum: "sha256:{{ terraform_expected_checksum.stdout }}"
  when: not ansible_check_mode

- name: Extract Terraform binary
  ansible.builtin.unarchive:
    src: "{{ terraform_zip_path }}"
    dest: "{{ terraform_work_dir }}"
    remote_src: true
    creates: "{{ terraform_work_dir }}/terraform"
  when: not ansible_check_mode

- name: Install Terraform binary
  ansible.builtin.copy:
    src: "{{ terraform_work_dir }}/terraform"
    dest: "{{ terraform_bin_path }}"
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  when: not ansible_check_mode

- name: Check Terraform version
  ansible.builtin.command:
    cmd: "{{ terraform_bin_path }} version"
  register: terraform_version_check
  changed_when: false
