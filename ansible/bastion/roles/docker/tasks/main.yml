---
- name: Set Docker variables
  ansible.builtin.set_fact:
    docker_gpg_key: /etc/apt/keyrings/docker.asc
    docker_repo_file: /etc/apt/sources.list.d/docker.list

- name: Remove old/conflicting Docker packages
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-doc
      - docker-compose
      - docker-compose-v2
      - podman-docker
      - containerd
      - runc
    state: absent

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: "{{ docker_gpg_key }}"
    mode: "0644"

- name: Add Docker apt repository
  ansible.builtin.copy:
    dest: "{{ docker_repo_file }}"
    mode: "0644"
    content: |
      deb [arch=amd64 signed-by={{ docker_gpg_key }}] https://download.docker.com/linux/ubuntu {{ ansible_facts["distribution_release"] }} stable

- name: Install Docker Engine packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Add SSH user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
  when: ansible_user is defined
