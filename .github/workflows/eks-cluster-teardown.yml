name: EKS Cluster Teardown

on:
  workflow_dispatch:
    inputs:
      confirm_teardown:
        description: Type teardown to confirm EKS cluster add-on teardown
        required: true
        type: string

jobs:
  eks-cluster-teardown:
    name: EKS Cluster Teardown
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: eks-cluster

    env:
      my_eks_cluster_name: ${{ vars.EKS_CLUSTER_NAME }}
      my_aws_region_name: ${{ vars.AWS_REGION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check teardown confirmation
        if: ${{ inputs.confirm_teardown != 'teardown' }}
        run: |
          echo "confirm_teardown must be set to teardown."
          exit 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set default AWS region
        run: aws configure set region "${{ vars.AWS_REGION }}"

      - name: Install kubectl
        run: |
          curl -fsSLo kubectl https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl
          chmod +x kubectl
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          kubectl version --client=true

      - name: Install Helm
        run: |
          curl -fsSLo helm-v4.1.0-linux-amd64.tar.gz https://get.helm.sh/helm-v4.1.0-linux-amd64.tar.gz
          tar -zxvf helm-v4.1.0-linux-amd64.tar.gz
          sudo install -o root -g root -m 0755 linux-amd64/helm /usr/local/bin/helm
          helm version --short

      - name: Install eksctl
        run: |
          curl -fsSLo eksctl_Linux_amd64.tar.gz https://github.com/eksctl-io/eksctl/releases/download/v0.226.0/eksctl_Linux_amd64.tar.gz
          tar -zxvf eksctl_Linux_amd64.tar.gz
          sudo install -o root -g root -m 0755 eksctl /usr/local/bin/eksctl
          eksctl version

      - name: Run EKS cluster teardown script
        run: ./eks-cluster-teardown.sh
