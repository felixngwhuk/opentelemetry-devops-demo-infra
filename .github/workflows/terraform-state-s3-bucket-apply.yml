name: Terraform State S3 Bucket Apply

on:
  workflow_dispatch:

jobs:
  terraform-state-s3-bucket-apply:
    name: Terraform State S3 Bucket Apply
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: aws-infra/terraform-state-s3-bucket

    env:
      TF_VAR_region: ${{ vars.AWS_REGION }}
      TF_VAR_terraform_state_bucket: ${{ vars.TERRAFORM_STATE_BUCKET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set default AWS region
        run: aws configure set region "${{ vars.AWS_REGION }}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3

      - name: Terraform init
        run: terraform init

      - name: Terraform apply
        run: terraform apply -auto-approve
